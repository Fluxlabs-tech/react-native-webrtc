name: Android CI
on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'

jobs:
  android-compile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install node modules
      run: npm install

    # The library is New Architecture only and needs React Native 0.76 or later. GumTestApp,
    # upstream's example, is on 0.71, so CI builds LivestreamExample, on 0.86.
    - name: Install example node modules
      run: npm ci
      working-directory: ./examples/LivestreamExample/

    - name: Generate the example's native project
      run: npx expo prebuild --platform android --no-install
      working-directory: ./examples/LivestreamExample/

    - name: Compile Android Example
      run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a
      working-directory: ./examples/LivestreamExample/android
