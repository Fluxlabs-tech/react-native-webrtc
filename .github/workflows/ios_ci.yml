name: iOS CI
on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  workflow_call:

jobs:
  ios-compile:
    runs-on: macos-26
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'

    - name: Install node modules
      run: npm install

    # The library is New Architecture only and needs React Native 0.76 or later. GumTestApp,
    # upstream's example, is on 0.71, so CI builds LivestreamExample, on 0.86.
    - name: Install example node modules
      working-directory: ./examples/LivestreamExample/
      run: npm ci

    - name: Generate the example's native project
      working-directory: ./examples/LivestreamExample/
      run: npx expo prebuild --platform ios --no-install

    - name: Pod install
      working-directory: ./examples/LivestreamExample/ios
      run: pod install

    - name: Compile iOS Example
      working-directory: ./examples/LivestreamExample/ios
      run: |
        xcodebuild -workspace WebRTCLivestream.xcworkspace \
          -scheme WebRTCLivestream \
          -destination generic/platform=iOS \
          -quiet \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_ENTITLEMENTS="" \
          CODE_SIGNING_ALLOWED="NO" clean build
